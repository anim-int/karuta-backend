[package]
name = "karuta_backend"
version = "1.1.0"
edition = "2021"

[dependencies]
crossbeam-channel = "0.5.15"
rand = "0.9.0"
reqwest = { version = "0.12.12", features = ["blocking", "json"] }
rocket = { version = "0.5.1", features = ["json"] }
rocket_okapi = { version = "0.9.0", features = ["swagger"] }
rocket_ws = "0.1.1"
schemars = "0.8.21"
serde = { version = "1.0.207", features = ["serde_derive"] }
serde_json = "1.0.124"
toml = "0.8.22"
